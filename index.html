<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="GaragePro — Système de gestion pour garage automobile" />
    <script>
      /* Applique le thème enregistré avant le premier rendu (pas de flash). */
      try {
        if (localStorage.getItem('garagepro-theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1326')
        }
      } catch (e) {}
    </script>
  <title>GaragePro — Gestion de garage automobile</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
